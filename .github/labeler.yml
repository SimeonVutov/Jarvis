# Maps file path patterns to labels.
# Labels must exist in the repo first — run the setup-labels workflow.

backend:
  - changed-files:
    - any-glob-to-any-file: "backend/**"

frontend:
  - changed-files:
    - any-glob-to-any-file: "frontend/**"

ai:
  - changed-files:
    - any-glob-to-any-file:
      - "backend/ai.py"
      - "backend/routes/chat.py"
      - "backend/memory.py"

tests:
  - changed-files:
    - any-glob-to-any-file: "tests/**"

ci:
  - changed-files:
    - any-glob-to-any-file: ".github/**"

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - "README.md"
      - "docs/**"
      - "*.md"

dependencies:
  - changed-files:
    - any-glob-to-any-file: "requirements.txt"
