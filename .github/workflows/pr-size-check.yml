name: PR Size Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  size:
    name: Check PR size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count changed lines and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const additions = files.reduce((sum, f) => sum + f.additions, 0);
            const deletions = files.reduce((sum, f) => sum + f.deletions, 0);
            const total     = additions + deletions;
            const fileCount = files.length;

            let label = "";
            let emoji = "";
            if      (total < 100)  { label = "XS";     emoji = "🟢"; }
            else if (total < 300)  { label = "S";       emoji = "🟢"; }
            else if (total < 600)  { label = "M";       emoji = "🟡"; }
            else if (total < 1000) { label = "L";       emoji = "🟠"; }
            else                   { label = "XL";      emoji = "🔴"; }

            const body = [
              `## ${emoji} PR Size: **${label}**`,
              ``,
              `| Metric     | Value |`,
              `|------------|-------|`,
              `| Files      | ${fileCount} |`,
              `| Additions  | +${additions} |`,
              `| Deletions  | -${deletions} |`,
              `| Total      | ${total} lines |`,
              ``,
              total > 600
                ? `> ⚠️ This is a large PR. Consider splitting it into smaller, focused changes for easier review.`
                : `> ✅ This PR is a manageable size.`,
            ].join("\n");

            // Find and update existing size comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body.startsWith("## ") && c.body.includes("PR Size:"));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

            // Fail if the PR is XL (over 1000 changed lines)
            if (total > 1000) {
              core.setFailed(`PR is too large (${total} lines changed). Split it into smaller PRs.`);
            }
