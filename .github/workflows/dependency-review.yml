name: Dependency Review

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "requirements.txt"

permissions:
  contents: read

jobs:
  review:
    name: Check for vulnerable dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  audit:
    name: Pip audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --format markdown

  licenses:
    name: Check dependency licenses
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-licenses
        run: pip install pip-licenses -r requirements.txt

      - name: List licenses
        run: pip-licenses --format=markdown --order=license

      - name: Fail on GPL licenses
        run: |
          # Jarvis uses a non-commercial license — GPL dependencies would be a conflict
          if pip-licenses --format=plain | grep -i "^GNU General Public License"; then
            echo "GPL dependency found — review required"
            exit 1
          fi
          echo "No GPL dependencies found"
