name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check all Python files parse cleanly
        run: |
          python3 << 'EOF'
          import ast, pathlib, sys

          candidates = (
              list(pathlib.Path("backend").rglob("*.py"))
              + [pathlib.Path("server.py"), pathlib.Path("jarvis.py")]
          )
          files  = [f for f in candidates if f.exists()]
          errors = []

          for f in files:
              try:
                  ast.parse(f.read_text())
                  print(f"  OK  {f}")
              except SyntaxError as e:
                  errors.append(f"  ERR {f}: line {e.lineno} — {e.msg}")

          if errors:
              print("\nSyntax errors found:")
              for e in errors: print(e)
              sys.exit(1)

          print(f"\n{len(files)} files — all OK")
          EOF

  security:
    name: Security scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          # B101 = assert used (fine in tests)
          # B311 = random not suitable for crypto (we use os.urandom, not random)
          # B608 = SQL injection false positive — our IN (?,?,?) pattern is fully
          #        parameterised; the f-string only interpolates a count of "?"
          #        placeholders, never user data. Bandit cannot detect this pattern.
          bandit -r backend/ server.py \
            --severity-level medium \
            --confidence-level medium \
            --skip B101,B311,B608 \
            -f txt

  structure:
    name: Verify project structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files and directories exist
        run: |
          python3 << 'EOF'
          import pathlib, sys

          required = [
            # Backend modules
            "backend/__init__.py",
            "backend/state.py",
            "backend/config.py",
            "backend/crypto.py",
            "backend/database.py",
            "backend/memory.py",
            "backend/ai.py",
            "backend/downloader.py",
            "backend/schemas.py",
            "backend/app.py",
            # Routes
            "backend/routes/__init__.py",
            "backend/routes/auth.py",
            "backend/routes/chat.py",
            "backend/routes/dashboard.py",
            "backend/routes/fitness.py",
            "backend/routes/models.py",
            "backend/routes/news.py",
            "backend/routes/profile.py",
            "backend/routes/projects.py",
            "backend/routes/reminders.py",
            "backend/routes/stats.py",
            # Frontend
            "frontend/index.html",
            "frontend/css/variables.css",
            "frontend/css/base.css",
            "frontend/css/animations.css",
            "frontend/css/layout.css",
            "frontend/css/components.css",
            "frontend/css/pages.css",
            "frontend/src/api.js",
            "frontend/src/utils.js",
            "frontend/src/App.jsx",
            # Root
            "server.py",
            "jarvis.py",
            "requirements.txt",
            "install.sh",
            "uninstall.sh",
          ]

          missing = [f for f in required if not pathlib.Path(f).exists()]

          if missing:
              print("Missing required files:")
              for f in missing: print(f"  ✗  {f}")
              sys.exit(1)

          print(f"All {len(required)} required files present")
          EOF
