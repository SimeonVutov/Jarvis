name: Close Stale Issues and PRs

on:
  schedule:
    # Runs every day at 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 30 days and has been marked as stale.
            If it is still relevant, please leave a comment or it will be closed in 7 days.
          stale-pr-message: >
            This PR has been inactive for 14 days and has been marked as stale.
            Please update it or it will be closed in 7 days.
          close-issue-message: "Closed due to inactivity."
          close-pr-message: "Closed due to inactivity. Feel free to reopen."
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,bug"
          exempt-pr-labels: "pinned,work-in-progress"
