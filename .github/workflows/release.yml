name: Release

# Fires only when a commit lands on main (i.e. the develop → main PR is merged).
# Reads the version from VERSION file, runs the full test suite,
# then automatically creates a git tag and GitHub Release.
on:
  push:
    branches:
      - main

jobs:
  # ── Step 1: full verification — must pass before release ────────
  verify:
    name: Full verification before release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Write test config
        run: |
          mkdir -p test_data
          cat > config.json << 'EOF'
          {
            "models": {
              "study":   "mock",
              "coding":  "mock",
              "general": "mock",
              "embed":   "mock"
            },
            "user": {
              "name":     "ReleaseTestUser",
              "brief":    "CI release verification.",
              "city":     "Amsterdam",
              "timezone": "Europe/Amsterdam"
            },
            "news":   { "sources": [] },
            "server": { "host": "127.0.0.1", "port": 17777 },
            "data_dir": "test_data"
          }
          EOF

      - name: Python syntax check
        run: |
          python3 << 'EOF'
          import ast, pathlib, sys
          files  = list(pathlib.Path("backend").rglob("*.py")) + [pathlib.Path("server.py")]
          errors = []
          for f in files:
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f"{f}: line {e.lineno} — {e.msg}")
          if errors:
              for e in errors: print(f"SYNTAX ERROR: {e}")
              sys.exit(1)
          print(f"All {len(files)} Python files OK")
          EOF

      - name: Backend unit tests
        run: pytest tests/ -v --ignore=tests/integration --tb=short

      - name: Integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          JARVIS_TEST_MODE: "1"

      - name: Verify required files exist
        run: |
          python3 << 'EOF'
          import pathlib, sys
          required = [
            "backend/__init__.py", "backend/app.py", "backend/ai.py",
            "backend/routes/chat.py", "backend/routes/projects.py",
            "frontend/index.html", "frontend/src/App.jsx",
            "frontend/css/variables.css", "server.py",
            "requirements.txt", "install.sh", "uninstall.sh", "VERSION",
          ]
          missing = [f for f in required if not pathlib.Path(f).exists()]
          if missing:
              for f in missing: print(f"MISSING: {f}")
              sys.exit(1)
          print(f"All {len(required)} required files present")
          EOF

      - name: Cleanup
        if: always()
        run: rm -rf test_data config.json

  # ── Step 2: tag and publish — only runs if verify passed ────────
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION"    >> $GITHUB_OUTPUT
          echo "Releasing version: v$VERSION"

      - name: Fail if tag already exists
        run: |
          if git rev-parse "${{ steps.version.outputs.TAG }}" &>/dev/null; then
            echo "ERROR: tag ${{ steps.version.outputs.TAG }} already exists."
            echo "Bump the version number in the VERSION file before merging to main."
            exit 1
          fi

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build release archives
        run: |
          TAG=${{ steps.version.outputs.TAG }}
          FOLDER="jarvis-${TAG}"
          mkdir -p "release/$FOLDER"
          rsync -av \
            --exclude='.git/' \
            --exclude='venv/' \
            --exclude='data/' \
            --exclude='config.json' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='release/' \
            --exclude='test_data/' \
            . "release/$FOLDER/"
          cd release
          tar -czf "${FOLDER}.tar.gz" "${FOLDER}/"
          zip -r   "${FOLDER}.zip"    "${FOLDER}/"

      - name: Create and push git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG }}" \
                  -m "Release ${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name:     "Jarvis ${{ steps.version.outputs.TAG }}"
          body: |
            ## What's changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd Jarvis
            bash install.sh
            ```

            See [README.md](README.md) for full setup instructions.
          files: |
            release/jarvis-${{ steps.version.outputs.TAG }}.tar.gz
            release/jarvis-${{ steps.version.outputs.TAG }}.zip
          draft: false
          prerelease: false
